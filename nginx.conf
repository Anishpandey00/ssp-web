server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # No trailing slash: Express must receive the original /api/... path.
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself must be re-checked on every visit, or browsers keep
    # showing an old version (pointing at old assets) after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support React Router when a page such as /dashboard is refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
