server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API gateway: each /api/... path goes to the service that owns it.
    # Docker's DNS is asked again every 10s, and the address sits in a
    # variable, so nginx starts even when a service is down and finds it
    # again after it restarts. Without a URI part, proxy_pass forwards the
    # original /api/... path unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_service     http://auth-service:4000;
    set $task_service     http://task-service:4000;
    set $quiz_service     http://quiz-service:4000;
    set $progress_service http://progress-service:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;

    location ~ ^/api/(register|login|admin/users)(/|$) {
        proxy_pass $auth_service;
    }
    location ~ ^/api/tasks(/|$) {
        proxy_pass $task_service;
    }
    location ~ ^/api/(quizzes|scores|admin/quizzes)(/|$) {
        proxy_pass $quiz_service;
    }
    location ~ ^/api/progress(/|$) {
        proxy_pass $progress_service;
    }

    # The gateway's own health check.
    location = /api/health {
        default_type application/json;
        return 200 '{"ok":true,"service":"gateway"}';
    }

    # Any other /api/ path: a JSON 404 instead of the React page.
    location /api/ {
        default_type application/json;
        return 404 '{"ok":false,"error":"Not found."}';
    }

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The page itself must be re-checked on every visit, or browsers keep
    # showing an old version (pointing at old assets) after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support React Router when a page such as /dashboard is refreshed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
