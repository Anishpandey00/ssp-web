# Smart Study Planner as microservices: 7 containers.
#   frontend          nginx: serves React and is the API gateway (only public port)
#   auth-service      sign up, log in, admin users      -> auth_db
#   task-service      study tasks                       -> task_db
#   quiz-service      quizzes, questions, scores        -> quiz_db
#   progress-service  dashboard numbers, asks task + quiz (no database)
#   ai-service        AI study plan via Ollama on the host (no database)
#   db                PostgreSQL holding the three databases

# Settings every API service shares.
x-service-env: &service-env
  NODE_ENV: production
  PORT: 4000
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: 5432
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

x-healthcheck: &service-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 10s

services:
  db:
    image: postgres:16-alpine
    container_name: ssp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-smart_study_planner}
    volumes:
      - ssp-db-data:/var/lib/postgresql/data
    # Only on the private data network: no published port, and the frontend
    # and progress-service cannot reach it.
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  auth-service:
    build:
      context: ./services
      args:
        SERVICE: auth-service
    image: ssp-auth-service
    container_name: ssp-auth
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend-net, backend-net]
    environment:
      <<: [*service-env, *db-env]
      AUTH_DB_NAME: auth_db
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck: *service-healthcheck

  task-service:
    build:
      context: ./services
      args:
        SERVICE: task-service
    image: ssp-task-service
    container_name: ssp-task
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend-net, backend-net]
    environment:
      <<: [*service-env, *db-env]
      TASK_DB_NAME: task_db
    healthcheck: *service-healthcheck

  quiz-service:
    build:
      context: ./services
      args:
        SERVICE: quiz-service
    image: ssp-quiz-service
    container_name: ssp-quiz
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks: [frontend-net, backend-net]
    environment:
      <<: [*service-env, *db-env]
      QUIZ_DB_NAME: quiz_db
    healthcheck: *service-healthcheck

  progress-service:
    build:
      context: ./services
      args:
        SERVICE: progress-service
    image: ssp-progress-service
    container_name: ssp-progress
    restart: unless-stopped
    # Starts once the two services it calls are healthy. It has no database
    # and is not on backend-net, so it cannot reach the db at all.
    depends_on:
      task-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    networks: [frontend-net]
    environment:
      <<: *service-env
      TASK_SERVICE_URL: http://task-service:4000
      QUIZ_SERVICE_URL: http://quiz-service:4000
    healthcheck: *service-healthcheck

  ai-service:
    build:
      context: ./services
      args:
        SERVICE: ai-service
    image: ssp-ai-service
    container_name: ssp-ai
    restart: unless-stopped
    # No database. It calls Ollama, which runs on the host (the Mac app uses
    # the GPU; Ollama inside Docker on a Mac cannot). host-gateway makes
    # host.docker.internal work on Linux too. It stays healthy when Ollama is
    # off: only the AI buttons stop working.
    networks: [frontend-net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *service-env
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      # Study tips read the student's tasks and quiz scores from these.
      TASK_SERVICE_URL: http://task-service:4000
      QUIZ_SERVICE_URL: http://quiz-service:4000
    healthcheck: *service-healthcheck

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ssp-frontend
    restart: unless-stopped
    # Starts last, once every service is healthy. After that it keeps running
    # even if one service stops: nginx answers for that service's paths only.
    depends_on:
      auth-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
      progress-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks: [frontend-net]
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  # Gateway side: nginx <-> the five services, and progress <-> task/quiz.
  frontend-net:
    name: ssp-frontend-net
    driver: bridge
  # Private data side: auth/task/quiz <-> db. internal: no route to the internet.
  backend-net:
    name: ssp-backend-net
    driver: bridge
    internal: true

volumes:
  ssp-db-data:
