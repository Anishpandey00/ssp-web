services:
  db:
    image: postgres:16-alpine
    container_name: ssp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-smart_study_planner}
    volumes:
      - ssp-db-data:/var/lib/postgresql/data
    # Only on the private back-end network: no published port, so nothing
    # outside Docker (and not even the frontend) can reach the database.
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ssp-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Joins both networks: talks to the frontend on one and the database on
    # the other. "db" below is resolved by Docker's built-in DNS.
    networks:
      - frontend-net
      - backend-net
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-smart_study_planner}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-9001}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ssp-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    # nginx forwards /api/ to http://backend:4000 over this network.
    networks:
      - frontend-net
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

networks:
  # Browser-facing side: frontend <-> backend.
  frontend-net:
    name: ssp-frontend-net
    driver: bridge
  # Private data side: backend <-> db. internal: no route to the internet.
  backend-net:
    name: ssp-backend-net
    driver: bridge
    internal: true

volumes:
  ssp-db-data:
