name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today, and for whom (student, admin, developer)?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: requirement
    attributes:
      label: Related requirement
      description: SRS or NFR ID if any (e.g. REQ-8, NFR-5)
