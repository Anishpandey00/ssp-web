name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: Tests, build and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix services
      - run: for f in services/shared/*.js services/*/*.js; do node --check "$f"; done
      - name: Validate Compose file
        env:
          DB_PASSWORD: ci-placeholder-not-a-real-password
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: |
          docker compose config --quiet

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        env:
          DB_PASSWORD: ci-placeholder-not-a-real-password
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: docker compose build
      - name: Build Azure frontend image
        run: docker build -f docker/frontend.azure.Dockerfile -t ssp-frontend-azure:ci .
