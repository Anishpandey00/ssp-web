name: Project checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check server/index.js && node --check server/db.js
      - name: Validate local and Azure Compose files
        env:
          DB_PASSWORD: ci-placeholder-not-a-real-password
          JWT_SECRET: ci-placeholder-not-a-real-secret
        run: |
          docker compose config --quiet
          docker compose -f deploy/azure/compose.yaml config --quiet
